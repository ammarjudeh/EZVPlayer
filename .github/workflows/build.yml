name: Build EZV Player APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Generate project files
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EZV_EOF_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ezv.player"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ezv.player"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
          }
          EZV_EOF_0
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EZV_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.EZV">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PlayerActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:theme="@style/Theme.EZV.Player">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EZV_EOF_1
          mkdir -p "$(dirname 'app/src/main/java/com/ezv/player/MainActivity.kt')"
          cat > 'app/src/main/java/com/ezv/player/MainActivity.kt' <<'EZV_EOF_2'
          package com.ezv.player

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          class MainActivity : AppCompatActivity() {

              private val videos = mutableListOf<VideoItem>()
              private lateinit var adapter: VideoAdapter
              private lateinit var empty: TextView

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) loadVideos() else showEmpty(getString(R.string.permission_needed))
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  setSupportActionBar(findViewById(R.id.toolbar))

                  empty = findViewById(R.id.empty)
                  val list = findViewById<RecyclerView>(R.id.list)
                  list.layoutManager = LinearLayoutManager(this)
                  adapter = VideoAdapter(videos) { index -> openLocal(index) }
                  list.adapter = adapter

                  findViewById<Button>(R.id.btnStream).setOnClickListener { showStreamDialog() }
                  checkPermissionAndLoad()
              }

              private fun readPermission() =
                  if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_VIDEO
                  else Manifest.permission.READ_EXTERNAL_STORAGE

              private fun checkPermissionAndLoad() {
                  val perm = readPermission()
                  if (ContextCompat.checkSelfPermission(this, perm) == PackageManager.PERMISSION_GRANTED) {
                      loadVideos()
                  } else {
                      permissionLauncher.launch(perm)
                  }
              }

              private fun loadVideos() {
                  Thread {
                      val found = mutableListOf<VideoItem>()
                      val projection = arrayOf(
                          MediaStore.Video.Media._ID,
                          MediaStore.Video.Media.DISPLAY_NAME,
                          MediaStore.Video.Media.DURATION
                      )
                      contentResolver.query(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                          projection, null, null,
                          "${MediaStore.Video.Media.DATE_ADDED} DESC"
                      )?.use { c ->
                          val idCol = c.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                          val nameCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                          val durCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                          while (c.moveToNext()) {
                              val uri = Uri.withAppendedPath(
                                  MediaStore.Video.Media.EXTERNAL_CONTENT_URI, c.getLong(idCol).toString()
                              )
                              found.add(VideoItem(uri, c.getString(nameCol) ?: "?", c.getLong(durCol)))
                          }
                      }
                      runOnUiThread {
                          videos.clear()
                          videos.addAll(found)
                          adapter.notifyDataSetChanged()
                          if (videos.isEmpty()) showEmpty(getString(R.string.empty))
                          else empty.visibility = View.GONE
                      }
                  }.start()
              }

              private fun showEmpty(text: String) {
                  empty.text = text
                  empty.visibility = View.VISIBLE
              }

              private fun openLocal(index: Int) {
                  if (index < 0) return
                  val intent = Intent(this, PlayerActivity::class.java)
                      .putStringArrayListExtra(PlayerActivity.EXTRA_URIS, ArrayList(videos.map { it.uri.toString() }))
                      .putExtra(PlayerActivity.EXTRA_INDEX, index)
                  startActivity(intent)
              }

              private fun showStreamDialog() {
                  val input = EditText(this).apply { hint = getString(R.string.stream_hint) }
                  AlertDialog.Builder(this)
                      .setTitle(R.string.stream)
                      .setView(input)
                      .setPositiveButton(R.string.play) { _, _ ->
                          val url = input.text.toString().trim()
                          if (url.isNotEmpty()) {
                              startActivity(
                                  Intent(this, PlayerActivity::class.java).setData(Uri.parse(url))
                              )
                          }
                      }
                      .setNegativeButton(R.string.cancel, null)
                      .show()
              }
          }
          EZV_EOF_2
          mkdir -p "$(dirname 'app/src/main/java/com/ezv/player/PlayerActivity.kt')"
          cat > 'app/src/main/java/com/ezv/player/PlayerActivity.kt' <<'EZV_EOF_3'
          package com.ezv.player

          import android.net.Uri
          import android.os.Bundle
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class PlayerActivity : AppCompatActivity() {

              companion object {
                  const val EXTRA_URIS = "uris"
                  const val EXTRA_INDEX = "index"
                  private const val STATE_INDEX = "state_index"
                  private const val STATE_POS = "state_pos"
              }

              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private var startIndex = 0
              private var startPosition = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_player)
                  playerView = findViewById(R.id.playerView)
                  playerView.keepScreenOn = true

                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }

                  startIndex = savedInstanceState?.getInt(STATE_INDEX)
                      ?: intent.getIntExtra(EXTRA_INDEX, 0)
                  startPosition = savedInstanceState?.getLong(STATE_POS) ?: 0L
              }

              override fun onStart() {
                  super.onStart()
                  initPlayer()
              }

              override fun onStop() {
                  super.onStop()
                  releasePlayer()
              }

              private fun buildItems(): List<MediaItem> {
                  val uris = intent.getStringArrayListExtra(EXTRA_URIS)
                  if (!uris.isNullOrEmpty()) return uris.map { MediaItem.fromUri(Uri.parse(it)) }
                  intent.data?.let { return listOf(MediaItem.fromUri(it)) }
                  return emptyList()
              }

              private fun initPlayer() {
                  val items = buildItems()
                  if (items.isEmpty()) {
                      finish()
                      return
                  }
                  val exo = ExoPlayer.Builder(this).build()
                  exo.addListener(object : Player.Listener {
                      override fun onPlayerError(error: PlaybackException) {
                          Toast.makeText(this@PlayerActivity, R.string.play_error, Toast.LENGTH_LONG).show()
                      }
                  })
                  playerView.player = exo
                  exo.setMediaItems(items, startIndex.coerceIn(0, items.size - 1), startPosition)
                  exo.prepare()
                  exo.playWhenReady = true
                  player = exo
              }

              private fun releasePlayer() {
                  player?.let {
                      startIndex = it.currentMediaItemIndex
                      startPosition = it.currentPosition
                      it.release()
                  }
                  player = null
                  playerView.player = null
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  player?.let {
                      outState.putInt(STATE_INDEX, it.currentMediaItemIndex)
                      outState.putLong(STATE_POS, it.currentPosition)
                  }
              }
          }
          EZV_EOF_3
          mkdir -p "$(dirname 'app/src/main/java/com/ezv/player/VideoAdapter.kt')"
          cat > 'app/src/main/java/com/ezv/player/VideoAdapter.kt' <<'EZV_EOF_4'
          package com.ezv.player

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import java.util.Locale

          class VideoAdapter(
              private val items: List<VideoItem>,
              private val onClick: (Int) -> Unit
          ) : RecyclerView.Adapter<VideoAdapter.VH>() {

              class VH(view: View) : RecyclerView.ViewHolder(view) {
                  val title: TextView = view.findViewById(R.id.title)
                  val duration: TextView = view.findViewById(R.id.duration)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH =
                  VH(LayoutInflater.from(parent.context).inflate(R.layout.item_video, parent, false))

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val item = items[position]
                  holder.title.text = item.name
                  holder.duration.text = format(item.durationMs)
                  holder.itemView.setOnClickListener { onClick(holder.bindingAdapterPosition) }
              }

              override fun getItemCount(): Int = items.size

              private fun format(ms: Long): String {
                  val total = ms / 1000
                  val h = total / 3600
                  val m = (total % 3600) / 60
                  val s = total % 60
                  return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, s)
                  else String.format(Locale.US, "%d:%02d", m, s)
              }
          }
          EZV_EOF_4
